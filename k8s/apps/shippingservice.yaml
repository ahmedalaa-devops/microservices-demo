apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
  labels: {app: shippingservice}
spec:
  replicas: __REPLICAS__
  selector:
    matchLabels: {app: shippingservice}
  template:
    metadata:
      labels: {app: shippingservice}
    spec:
      imagePullSecrets:
        - name: nexus-pull
      terminationGracePeriodSeconds: 5
      securityContext: {fsGroup: 1000, runAsGroup: 1000, runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: server
          image: __REGISTRY__/shippingservice:__TAG__
          ports:
            - containerPort: 50051
          env:
            - {name: PORT, value: "50051"}
          startupProbe:
            grpc: {port: 50051}
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            grpc: {port: 50051}
            periodSeconds: 5
          livenessProbe:
            grpc: {port: 50051}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: shippingservice
  labels: {app: shippingservice}
spec:
  type: ClusterIP
  selector: {app: shippingservice}
  ports:
    - {name: grpc, port: 50051, targetPort: 50051}
