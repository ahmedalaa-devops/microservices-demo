apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cart
  labels: {app: redis-cart}
spec:
  serviceName: redis-cart
  replicas: 1
  selector:
    matchLabels: {app: redis-cart}
  template:
    metadata:
      labels: {app: redis-cart}
    spec:
      terminationGracePeriodSeconds: 10
      securityContext: {fsGroup: 999, runAsGroup: 999, runAsUser: 999, runAsNonRoot: true}
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes", "--save", "60", "1"]
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket: {port: 6379}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 6379}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  labels: {app: redis-cart}
spec:
  type: ClusterIP
  selector: {app: redis-cart}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}
