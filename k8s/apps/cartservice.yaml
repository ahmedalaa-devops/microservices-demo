apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  labels: {app: cartservice}
spec:
  replicas: __REPLICAS__
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels: {app: cartservice}
  template:
    metadata:
      labels: {app: cartservice}
    spec:
      imagePullSecrets:
        - name: nexus-pull
      terminationGracePeriodSeconds: 5
      securityContext: {fsGroup: 1000, runAsGroup: 1000, runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: server
          image: __REGISTRY__/cartservice:__TAG__
          ports:
            - containerPort: 7070
          env:
            - {name: REDIS_ADDR, value: "redis-cart:6379"}
          startupProbe:
            grpc: {port: 7070}
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            grpc: {port: 7070}
            periodSeconds: 5
          livenessProbe:
            grpc: {port: 7070}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cartservice-data
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  labels: {app: cartservice}
spec:
  type: ClusterIP
  selector: {app: cartservice}
  ports:
    - {name: grpc, port: 7070, targetPort: 7070}
