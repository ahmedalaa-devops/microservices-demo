apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
spec:
  replicas: __REPLICAS__
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
    spec:
      imagePullSecrets:
        - name: nexus-pull
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          image: __REGISTRY__/cartservice:__TAG__
          ports:
            - containerPort: 7070
          env:
            - name: REDIS_ADDR
              value: redis-cart:6379
          startupProbe:
            grpc:
              port: 7070
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            grpc:
              port: 7070
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 7070
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cartservice-data
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
spec:
  selector:
    app: cartservice
  ports:
    - port: 7070
      targetPort: 7070
